# Чек-лист оценки звонка. Меняется под скрипт продаж конкретной компании.
# weight — вес пункта в итоговом балле (сумма весов не обязана быть 100, балл нормируется).
# keywords — для офлайн-оценки без нейросети (демо и запасной режим): пункт засчитан,
#            если в речи встречается хотя бы одна фраза (без учёта регистра).

company = "Онлайн-школа «Пиксель»"
min_duration = 20   # звонки короче (сек) не оцениваем

[[item]]
id = "greeting"
title = "Приветствие и представление"
description = "Менеджер поздоровался, назвал своё имя и компанию."
weight = 10
keywords = ["здравствуйте", "добрый день", "добрый вечер", "меня зовут", "школа «пиксель»", "школа пиксель"]

[[item]]
id = "client_name"
title = "Узнал имя клиента"
description = "Менеджер спросил, как обращаться к клиенту, и использовал имя в разговоре."
weight = 10
keywords = ["как к вам обращаться", "как вас зовут", "подскажите ваше имя"]

[[item]]
id = "needs"
title = "Выявил потребность"
description = "Задал открытые вопросы: возраст ребёнка, цель занятий, опыт, интересы."
weight = 25
keywords = ["сколько лет", "какой класс", "для чего", "какая цель", "чем увлекается", "что нравится", "что ему понравилось", "что ей понравилось", "занимался ли", "занималась ли"]

[[item]]
id = "presentation"
title = "Презентовал решение под потребность"
description = "Рассказал о курсе/формате, связав его с тем, что сказал клиент."
weight = 20
keywords = ["вам подойдёт", "вам подойдет", "рекомендую", "для вашего", "как раз для"]

[[item]]
id = "objections"
title = "Отработал возражения"
description = "Если были сомнения (дорого, подумаю, нет времени) — менеджер их обработал, а не согласился сразу."
weight = 15
keywords = ["понимаю вас", "давайте разберёмся", "давайте разберемся", "именно поэтому", "можно начать с"]

[[item]]
id = "next_step"
title = "Договорился о следующем шаге"
description = "Записал на пробный урок, назначил дату звонка или отправил материалы с конкретным сроком."
weight = 20
keywords = ["записываю", "записала вас", "записал вас", "пробный урок", "перезвоню", "отправлю вам", "договорились"]
